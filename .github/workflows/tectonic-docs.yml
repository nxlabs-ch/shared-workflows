name: Build Documentation (using UV and Tectonic)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version number for the documentation'
        required: true
        type: string
      build-pdf:
        description: 'Whether to build the PDF version of the documentation (much faster if not)'
        required: false
        type: boolean
        default: true
      pdf-name:
        description: 'Name of the PDF file to generate'
        required: true
        type: string
      docs-folder:
        description: "The path to the docs folder from the root of the project, defaults to docs"
        default: docs
        required: false
        type: string
      makefile:
        description: "The makefile to use, defaults to Makefile"
        default: Makefile
        required: false
        type: string
      lfs:
        description: "Whether to pull LFS files, defaults to false"
        required: false
        type: boolean
        default: false
      submodules:
        description: "Whether to pull git submodules (false|true|recursive), defaults to false"
        required: false
        type: string
        default: 'false'
      dependencies:
        description: "Additional system (apt) dependencies"
        required: false
        type: string
      tectonic-version:
        description: "The Tectonic release to install"
        required: false
        type: string
        default: '0.17.0'
      timeout-minutes:
        description: "Maximum duration of the documentation build job, in minutes"
        required: false
        type: number
        default: 30
      env:
        description: "Additional environment variables for the build steps, as newline-separated KEY=VALUE pairs"
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: "Suffix (without leading '-') appended to the uploaded HTML artifact name and the PDF filename, to distinguish multiple builds of the same version (e.g. from a matrix)"
        required: false
        type: string
        default: ''
    secrets:
      ssh-key:
        description: "SSH private key to use for checking out private submodules"
        required: false

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.ssh-key }}
          lfs: ${{ inputs.lfs }}
          submodules: ${{ inputs.submodules }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.6.x"

      - name: Set up Python
        run: uv python install

      - name: Install additional system dependencies
        if: ${{ inputs.dependencies != '' }}
        timeout-minutes: 15
        env:
          # Passed through the environment rather than interpolated, so that a caller's
          # input cannot inject shell code.
          PACKAGES: ${{ inputs.dependencies }}
        run: |
          set -euo pipefail
          # Word splitting of APT_OPTS and PACKAGES is intentional below.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            sudo apt-get $APT_OPTS update && break
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get update failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 15))
          done
          # No --no-install-recommends here: callers pass arbitrary packages and may rely on recommends.
          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS install -y $PACKAGES

      - name: Configure Tectonic cache location
        if: ${{ inputs.build-pdf }}
        run: |
          # Pinned explicitly: Tectonic's default cache location is platform dependent
          # and differs from the documented one on some platforms.
          echo "TECTONIC_CACHE_DIR=${RUNNER_TEMP}/tectonic-cache" >> "$GITHUB_ENV"

      - name: Install Tectonic
        if: ${{ inputs.build-pdf }}
        timeout-minutes: 5
        env:
          TECTONIC_VERSION: ${{ inputs.tectonic-version }}
        run: |
          set -euo pipefail
          URL="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "${RUNNER_TEMP}/tectonic-bin"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "$URL" \
            | tar -xz -C "${RUNNER_TEMP}/tectonic-bin" tectonic
          echo "${RUNNER_TEMP}/tectonic-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/tectonic-bin/tectonic" --version

      - name: Cache Tectonic bundle
        if: ${{ inputs.build-pdf }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/tectonic-cache
          # Keyed on conf.py, which determines the LaTeX packages the document pulls in.
          # The restore-keys prefix means a miss still starts from the previous bundle
          # rather than fetching it all again.
          key: ${{ runner.os }}-tectonic-${{ inputs.tectonic-version }}-${{ hashFiles(format('{0}/conf.py', inputs.docs-folder)) }}
          restore-keys: |
            ${{ runner.os }}-tectonic-${{ inputs.tectonic-version }}-

      - name: Set additional environment variables
        if: ${{ inputs.env != '' }}
        run: echo "${{ inputs.env }}" >> "$GITHUB_ENV"

      - name: Compute artifact suffix
        id: suffix
        run: |
          if [ -n "${{ inputs.artifact-suffix }}" ]; then
            echo "value=-${{ inputs.artifact-suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version file
        run: echo "${{ inputs.version }}" > .version

      - name: Extract project name from conf.py
        id: project-name
        run: |
          PROJECT_NAME=$(python -c "
          import sys
          import re
          sys.path.insert(0, '${{ inputs.docs-folder }}')

          # Read conf.py and extract project name using regex
          try:
              with open('${{ inputs.docs-folder }}/conf.py', 'r') as f:
                  content = f.read()

              # Look for project = 'value' or project = \"value\"
              match = re.search(r'project\s*=\s*[\'\"](.*?)[\'\"]', content)
              if match:
                  project_name = match.group(1)
                  print(project_name.lower().replace(' ', '-'))
              else:
                  print('no-name')
          except Exception:
              print('no-name')
          ")
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "Extracted project name: $PROJECT_NAME"

      - name: Build HTML documentation
        run: make -f ${{ inputs.makefile }} -C ${{ inputs.docs-folder }} html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ steps.project-name.outputs.name }}${{ steps.suffix.outputs.value }}-html-${{ inputs.version }}
          path: "${{ inputs.docs-folder }}/_build/html/"
          retention-days: 30

      - name: Build PDF documentation
        if: ${{ inputs.build-pdf }}
        id: build-pdf
        env:
          # Passed through the environment rather than interpolated, so that a caller's
          # input cannot inject shell code.
          DOCS_FOLDER: ${{ inputs.docs-folder }}
          MAKEFILE: ${{ inputs.makefile }}
          PDF_NAME: ${{ inputs.pdf-name }}
        run: |
          set -euo pipefail
          make -f "$MAKEFILE" -C "$DOCS_FOLDER" latex

          LATEX_DIR="$DOCS_FOLDER/_build/latex"
          TEX_FILE="$LATEX_DIR/$(basename "$PDF_NAME" .pdf).tex"
          if [ ! -f "$TEX_FILE" ]; then
            # Fall back to discovery when the document name does not match `pdf-name`.
            mapfile -t CANDIDATES < <(find "$LATEX_DIR" -maxdepth 1 -name '*.tex')
            if [ "${#CANDIDATES[@]}" -ne 1 ]; then
              echo "::error::expected $TEX_FILE, found ${#CANDIDATES[@]} .tex files in $LATEX_DIR"
              exit 1
            fi
            TEX_FILE="${CANDIDATES[0]}"
          fi

          # Sphinx only emits `fontspec` when `latex_engine` is xelatex. Tectonic is a XeTeX
          # engine: it compiles pdflatex-targeted sources without failing, but silently drops
          # every non-ASCII glyph. Refuse rather than publish a quietly broken PDF.
          if ! grep -q 'fontspec' "$TEX_FILE"; then
            echo "::error::$TEX_FILE was generated for pdflatex. Set latex_engine = \"xelatex\" in $DOCS_FOLDER/conf.py."
            exit 1
          fi

          tectonic -X compile "$TEX_FILE" --outdir "$LATEX_DIR" 2>&1 | tee "${RUNNER_TEMP}/tectonic.log"
          if grep -q 'Missing character' "${RUNNER_TEMP}/tectonic.log"; then
            echo "::warning::Tectonic reported missing characters: some glyphs are absent from the PDF."
          fi

          # Tectonic names the PDF after the .tex it compiled, which is not necessarily `pdf-name`.
          echo "pdf-file=$(basename "${TEX_FILE%.tex}.pdf")" >> "$GITHUB_OUTPUT"

      - name: Rename PDF with version
        if: ${{ inputs.build-pdf }}
        run: |
          PDF_DIR="${{ inputs.docs-folder }}/_build/latex"
          ORIGINAL_PDF="${{ steps.build-pdf.outputs.pdf-file }}"
          # Extract filename without extension, from the requested name rather than the
          # compiled one, so the uploaded artifact always honours `pdf-name`.
          PDF_BASE=$(basename "${{ inputs.pdf-name }}" .pdf)
          # Create new filename with version
          NEW_PDF="${PDF_BASE}${{ steps.suffix.outputs.value }}-${{ inputs.version }}.pdf"
          # Rename the PDF file
          mv "$PDF_DIR/$ORIGINAL_PDF" "$PDF_DIR/$NEW_PDF"
          echo "new-pdf-name=$NEW_PDF" >> $GITHUB_OUTPUT
        id: rename-pdf

      - name: Upload PDF documentation
        if: ${{ inputs.build-pdf }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ steps.project-name.outputs.name }}${{ steps.suffix.outputs.value }}-pdf-${{ inputs.version }}
          path: "${{ inputs.docs-folder }}/_build/latex/${{ steps.rename-pdf.outputs.new-pdf-name }}"
