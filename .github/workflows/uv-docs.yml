name: Build Documentation (using UV)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version number for the documentation'
        required: true
        type: string
      build-pdf:
        description: 'Whether to build the PDF version of the documentation (much faster if not)'
        required: false
        type: boolean
        default: true
      pdf-name:
        description: 'Name of the PDF file to generate'
        required: true
        type: string
      docs-folder:
        description: "The path to the docs folder from the root of the project, defaults to docs"
        default: docs
        required: false
        type: string
      makefile:
        description: "The makefile to use, defaults to Makefile"
        default: Makefile
        required: false
        type: string
      lfs:
        description: "Whether to pull LFS files, defaults to false"
        required: false
        type: boolean
        default: false
      submodules:
        description: "Whether to pull git submodules (false|true|recursive), defaults to false"
        required: false
        type: string
        default: 'false'
      dependencies:
        description: "Additional system (apt) dependencies"
        required: false
        type: string
      latex-packages:
        description: "Additional apt packages to install alongside the LaTeX toolchain, space separated (e.g. 'texlive-fonts-extra')"
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: "Maximum duration of the documentation build job, in minutes"
        required: false
        type: number
        default: 30
      env:
        description: "Additional environment variables for the build steps, as newline-separated KEY=VALUE pairs"
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: "Suffix (without leading '-') appended to the uploaded HTML artifact name and the PDF filename, to distinguish multiple builds of the same version (e.g. from a matrix)"
        required: false
        type: string
        default: ''
    secrets:
      ssh-key:
        description: "SSH private key to use for checking out private submodules"
        required: false

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.ssh-key }}
          lfs: ${{ inputs.lfs }}
          submodules: ${{ inputs.submodules }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.6.x"

      - name: Set up Python
        run: uv python install

      - name: Install system dependencies for LaTeX
        if: ${{ inputs.build-pdf }}
        timeout-minutes: 15
        env:
          # Passed through the environment rather than interpolated, so that a caller's
          # input cannot inject shell code.
          EXTRA_PACKAGES: ${{ inputs.latex-packages }}
        run: |
          set -euo pipefail
          # Word splitting of APT_OPTS and EXTRA_PACKAGES is intentional below.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            sudo apt-get $APT_OPTS update && break
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get update failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 15))
          done
          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            tex-gyre \
            latexmk \
            $EXTRA_PACKAGES

      - name: Install additional system dependencies
        if: ${{ inputs.dependencies != '' }}
        timeout-minutes: 15
        env:
          # Passed through the environment rather than interpolated, so that a caller's
          # input cannot inject shell code.
          PACKAGES: ${{ inputs.dependencies }}
        run: |
          set -euo pipefail
          # Word splitting of APT_OPTS and PACKAGES is intentional below.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            sudo apt-get $APT_OPTS update && break
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get update failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 15))
          done
          # No --no-install-recommends here: callers pass arbitrary packages and may rely on recommends.
          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS install -y $PACKAGES

      - name: Set additional environment variables
        if: ${{ inputs.env != '' }}
        run: echo "${{ inputs.env }}" >> "$GITHUB_ENV"

      - name: Compute artifact suffix
        id: suffix
        run: |
          if [ -n "${{ inputs.artifact-suffix }}" ]; then
            echo "value=-${{ inputs.artifact-suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version file
        run: echo "${{ inputs.version }}" > .version

      - name: Extract project name from conf.py
        id: project-name
        run: |
          PROJECT_NAME=$(python -c "
          import sys
          import re
          sys.path.insert(0, '${{ inputs.docs-folder }}')
          
          # Read conf.py and extract project name using regex
          try:
              with open('${{ inputs.docs-folder }}/conf.py', 'r') as f:
                  content = f.read()
              
              # Look for project = 'value' or project = \"value\"
              match = re.search(r'project\s*=\s*[\'\"](.*?)[\'\"]', content)
              if match:
                  project_name = match.group(1)
                  print(project_name.lower().replace(' ', '-'))
              else:
                  print('no-name')
          except Exception:
              print('no-name')
          ")
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "Extracted project name: $PROJECT_NAME"

      - name: Build HTML documentation
        run: make -f ${{ inputs.makefile }} -C ${{ inputs.docs-folder }} html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ steps.project-name.outputs.name }}${{ steps.suffix.outputs.value }}-html-${{ inputs.version }}
          path: "${{ inputs.docs-folder }}/_build/html/"
          retention-days: 30

      - name: Build PDF documentation
        if: ${{ inputs.build-pdf }}
        run: make -f ${{ inputs.makefile }} -C ${{ inputs.docs-folder }} latexpdf

      - name: Rename PDF with version
        if: ${{ inputs.build-pdf }}
        run: |
          PDF_DIR="${{ inputs.docs-folder }}/_build/latex"
          ORIGINAL_PDF="${{ inputs.pdf-name }}"
          # Extract filename without extension
          PDF_BASE=$(basename "$ORIGINAL_PDF" .pdf)
          # Create new filename with version
          NEW_PDF="${PDF_BASE}${{ steps.suffix.outputs.value }}-${{ inputs.version }}.pdf"
          # Rename the PDF file
          mv "$PDF_DIR/$ORIGINAL_PDF" "$PDF_DIR/$NEW_PDF"
          echo "new-pdf-name=$NEW_PDF" >> $GITHUB_OUTPUT
        id: rename-pdf

      - name: Upload PDF documentation
        if: ${{ inputs.build-pdf }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ steps.project-name.outputs.name }}${{ steps.suffix.outputs.value }}-pdf-${{ inputs.version }}
          path: "${{ inputs.docs-folder }}/_build/latex/${{ steps.rename-pdf.outputs.new-pdf-name }}"
